  # [golangci-lint-./...]
  # golangci-lint exceeds the M (1Gi) budget and is OOMKilled at M --
  # proven by run 53e6d1d7 (2026-08-09); L grants 3Gi. GOMEMLIMIT rises
  # with the budget (SDK default 768MiB would GC-thrash inside an L pod).
  - name: golangci-lint-run
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/tmp/oberth-tools/bin/golangci-lint"]
      args: ["run", "--timeout=10m", "--concurrency=1", "./..."]
      env:
      - name: GOMEMLIMIT
        value: "2GiB"
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
        limits:
          cpu: "4"
          memory: "8Gi"

  # ---- test burn (single step) ----
  # Maps to: Test("test", repositorySteps(
  #   ctx.Go.TestRace("./...").Size(L))...).After("lint")
  # Race-instrumented full suite links large test binaries and needs more
  # than the M budget headroom. CGO_ENABLED=1 for the race detector; gcc
  # from the golang:1.26.6-trixie image provides the C compiler.
  - name: test
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/tmp/oberth-tools/bin/go"]
      args: ["test", "-race", "-v", "-count=1", "./..."]
