  # ---- security burn (single step) ----
  # Maps to: Test("security", repositorySteps(
  #   ctx.Scan.TrivyFS(".").Size(L))...).After("setup")
  # Uses the official trivy image pinned by digest -- no install step needed.
  # Trivy holds its vulnerability DB in memory; M is too tight.
  - name: security
    container:
      image: "aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c"
      workingDir: /work/src
      command: ["/usr/local/bin/trivy"]
      args:
      - "fs"
      - "--cache-dir"
      - "/tmp/oberth-trivy"
      - "--no-progress"
      - "--skip-check-update"
      - "--skip-vex-repo-update"
      - "--skip-version-check"
      - "--disable-telemetry"
      - "--scanners"
      - "vuln"
      - "--exit-code"
      - "1"
      - "--severity"
      - "HIGH,CRITICAL"
      - "--skip-dirs"
      - ".git"
      - "."
      env:
      - name: HOME
        value: "/tmp"
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
        limits:
          cpu: "4"
          memory: "8Gi"

