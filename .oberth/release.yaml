# Oberth release pipeline (tag-trigger) for the oberth repository.
#
# Every step is its own Argo template with its own container, exit code, and
# named log slice, which is the per-step granularity the Oberth execution model
# guarantees. Steps are deliberately not collapsed into shell scripts: a
# collapsed step reports one status for several pieces of work, and per-step
# status, logs and red are the entire point of the model.
#
# Oberth sets metadata.name, metadata.namespace, and labels
# (oberth.ci/repo, oberth.ci/trigger=tag, oberth.ci/ref, oberth.ci/sha) at
# submission time (applyServerMetadata).
#
# Oberth forces the serviceAccountName via a trigger-gated switch
# (ForceIdentity). Tag pushes bind to the release-tier ServiceAccount that
# can reach the company OpenBao via kubernetes-auth. The automounted token
# is what `oberth secretstore exec` presents to OpenBao's Kubernetes auth method.
#
# Oberth injects OBERTH_RELEASE_TAG and OBERTH_RELEASE_SHA into every
# release-tier container (injectRunEnvironment). release.sh and the
# templates below read them from the environment; no workflow-level
# parameters are needed.
#
# Oberth injects the source checkout into every container template
# (injectServerVolumes). The mechanism is a read-only mount at /work/src of a
# per-run PersistentVolumeClaim that the server creates in the pipeline
# namespace and fills with this revision before submitting: a Pod may only
# mount claims in its own namespace, so the server's own workspace volume is
# not reachable from here. Templates set workingDir: /work/src and do not
# declare the source mount themselves.
#
# Oberth injects a persistent Go module and build cache into every container
# template (injectServerVolumes -> cacheVolumeAndMount). The mechanism is a
# writable mount at /work/cache of node-local storage under the server's own
# --release-cache-root, in a directory scoped to this repository, and the
# server also sets GOMODCACHE=/work/cache/gomod and GOCACHE=/work/cache/gobuild.
#
# That injected environment OVERRIDES whatever this document sets for those two
# variables, which is why the GOMODCACHE/GOCACHE values and the /cache/gomod and
# /cache/gobuild mounts below are a fallback rather than the live configuration:
# they are what a server with no cache root configured falls back to, and they
# keep the caches shared between the steps of one run in that case. Do not
# declare a cache volume here -- admission refuses a repository hostPath, and
# the server decides whether a cache exists at all.
#
# Only these two caches persist between runs. Tool binaries stay on the per-run
# `work` claim on purpose: `go install` publishes into GOBIN with a truncating
# write, and a warm build cache makes reinstalling them a few seconds anyway.
#
# Release secrets, fetched in-Pod via `oberth secretstore exec`:
#   gar-sa-key:       oberth/data/release/gar-sa-key       (field GAR_SA_KEY)
#   r2-upload-token:  oberth/data/release/r2-upload-token  (field R2_UPLOAD_TOKEN)
#   cosign-secret:    oberth/data/release/cosign-secret    (fields COSIGN_KEY,
#     COSIGN_PUB; COSIGN_PASSWORD optional for an encrypted key)
#   homebrew-tap-key: oberth/data/release/homebrew-tap-key (field SSH_KEY;
#     write-only deploy key scoped to oberthci/homebrew-tap alone)
#
# exec writes each field verbatim as $OBERTH_SECRETSTORE_DIR/<path-base>/<field>
# -- there is no renaming layer, so release.sh reads exactly these field names.
# The env-var-style names date from the retired envconsul chain, which required
# them (docs/argo-secret-delivery.md); renaming a field in the store MUST be
# paired with the matching release.sh change (v0.13.1 failed on divergence).
#
# Credentialed release steps run:
#
#   oberth secretstore exec -> release.sh
#
# The server injects the oberth binary at /run/oberth/bin/oberth. Each
# credentialed step invokes `oberth secretstore exec` with --path flags
# declaring exactly the vault paths that step needs. The exec subcommand
# authenticates to OpenBao via Kubernetes auth using the release-tier
# ServiceAccount token (OBERTH_VAULT_ROLE from server-injected env), fetches
# the declared paths, writes them to $OBERTH_SECRETSTORE_DIR/<name>/<key> on
# a server-injected Memory emptyDir at /run/oberth-secrets (mode 0400), strips
# all VAULT_/BAO_/CONSUL_ variables and the login token, then execs release.sh.
#
# Each step declares only the paths it needs -- a step that only needs the R2
# token never fetches or holds the signing key. This is structurally enforced
# by the --path flags, not by configuration splitting.
#
# release.sh reads files from $OBERTH_SECRETSTORE_DIR and has no use for the
# credential that produced them.
#
# DAG structure:
#
#   release-setup --+--> release-lint --+--> release-test --------+--> release-build --+--> release-publish-r2 --+--> release-publish-homebrew (non-blocking) --+--> release-verify --> release-finalize
#                   |                   |                         |                    |                                                                        |
#                   +--> release-scan --+                         |                    +--> release-publish-images -----> release-package-chart --> release-publish-chart --+
#                   |                                             |
#                   +--> release-chart-test -----------------------
#
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  annotations:
    oberth.ci/size: L
    oberth.ci/secret-paths: oberth/data/release/gar-sa-key,oberth/data/release/r2-upload-token,oberth/data/release/cosign-secret,oberth/data/release/homebrew-tap-key
spec:
  entrypoint: release
  activeDeadlineSeconds: 14400

  volumeClaimTemplates:
  - metadata:
      name: work
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

  templates:

  # ---- DAG entrypoint ----
  - name: release
    dag:
      tasks:
      - name: release-setup
        template: release-setup
      - name: release-lint
        template: release-lint
        depends: release-setup
      - name: release-scan
        template: release-scan
        depends: release-setup
      - name: release-test
        template: release-test
        depends: "release-lint && release-scan"
      - name: release-chart-test
        template: release-chart-test
        depends: release-setup
      - name: release-build
        template: release-build
        depends: "release-test && release-chart-test"
      - name: release-publish-r2
        template: release-publish-r2
        depends: release-build
      - name: release-publish-images
        template: release-publish-images
        depends: release-build
      # Homebrew publishing is non-blocking: the deploy key may not be
      # registered on the upstream forge yet, and a missing key should not
      # fail the entire release. release-verify absorbs all outcomes via
      # its depends expression (Succeeded || Failed || Errored).
      - name: release-publish-homebrew
        template: release-publish-homebrew
        depends: release-publish-r2
      - name: release-package-chart
        template: release-package-chart
        depends: release-publish-images
      - name: release-publish-chart
        template: release-publish-chart
        depends: "release-publish-r2 && release-package-chart"
      - name: release-verify
        template: release-verify
        depends: "release-publish-chart && (release-publish-homebrew.Succeeded || release-publish-homebrew.Failed || release-publish-homebrew.Errored)"
      - name: release-finalize
        template: release-finalize
        depends: release-verify

  # ---- release-setup burn (10 sequential steps) ----
  # Maps to: releaseBurn("release-setup", nil,
  #   append(inlineToolchainSteps(),
  #     build-release-support, build-release-image, validate-tag,
  #   )...)
  # trivy is copied from the official image (copy-trivy) for publish-images and
  # verify; release-scan uses the official image as its own container directly.
  - name: release-setup
    steps:
    - - name: tools-dir
        template: tools-dir
    - - name: copy-trivy
        template: copy-trivy
    - - name: link-go
        template: link-go
    - - name: install-golangci-lint
        template: install-golangci-lint
    - - name: install-helm
        template: install-helm
    - - name: fetch-cosign
        template: fetch-cosign
    - - name: verify-cosign
        template: verify-cosign
    - - name: install-cosign
        template: install-cosign
    - - name: build-release-support
        template: build-release-support
    - - name: build-release-image
        template: build-release-image
    - - name: validate-tag
        template: validate-tag

  # [tools-dir]
  - name: tools-dir
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/bin/mkdir"]
      args: ["-p", "/tmp/oberth-tools/bin"]
      env:
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # [copy-trivy] -- copies the static binary from the official image into the
  # shared tools directory so publish-images and verify can call it from PATH.
  # This replaces the old go-install step (~332s) with a sub-second cp.
  - name: copy-trivy
    container:
      image: "aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c"
      workingDir: /work/src
      command: ["/bin/cp"]
      args: ["/usr/local/bin/trivy", "/tmp/oberth-tools/bin/trivy"]
      env:
      - name: HOME
        value: "/tmp"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      resources:
        requests:
          cpu: "1"
          memory: "512Mi"
        limits:
          cpu: "1"
          memory: "512Mi"

  # [link-go]
  - name: link-go
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/bin/ln"]
      args: ["-sf", "/usr/local/go/bin/go", "/usr/local/go/bin/gofmt", "/tmp/oberth-tools/bin"]
      env:
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # [install-golangci-lint]
  - name: install-golangci-lint
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/usr/local/go/bin/go"]
      args: ["install", "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2"]
      env:
      - name: GOBIN
        value: "/tmp/oberth-tools/bin"
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # [install-helm]
  - name: install-helm
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/usr/local/go/bin/go"]
      args: ["install", "helm.sh/helm/v4/cmd/helm@v4.2.3"]
      env:
      - name: GOBIN
        value: "/tmp/oberth-tools/bin"
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # [fetch-cosign]
  - name: fetch-cosign
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/usr/bin/curl"]
      args:
      - "--fail"
      - "--location"
      - "--no-progress-meter"
      - "--show-error"
      - "--connect-timeout"
      - "10"
      - "--max-time"
      - "90"
      - "--retry"
      - "2"
      - "--retry-all-errors"
      - "--proto"
      - "=https"
      - "--proto-redir"
      - "=https"
      - "--tlsv1.2"
      - "--output"
      - "/tmp/oberth-tools/bin/cosign"
      - "https://github.com/sigstore/cosign/releases/download/v3.1.1/cosign-linux-amd64"
      env:
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # [verify-cosign]
  - name: verify-cosign
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/usr/bin/sha256sum"]
      args: ["-c", ".oberth/pins/cosign.sha256"]
      env:
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # [install-cosign]
  - name: install-cosign
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/bin/chmod"]
      args: ["0755", "/tmp/oberth-tools/bin/cosign"]
      env:
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # [build-release-support] build the release heartbeat/orchestration binary
  - name: build-release-support
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/tmp/oberth-tools/bin/go"]
      args: ["build", "-trimpath", "-buildvcs=false", "-o", "/tmp/oberth-tools/bin/oberth-release-support", "./cmd/oberth-release-support"]
      env:
      - name: CGO_ENABLED
        value: "0"
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
