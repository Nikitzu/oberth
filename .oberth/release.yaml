  # ---- release-publish-chart burn (secretstore exec, mutex-gated) ----
  # This step updates the shared chart index (index.yaml) using a
  # compare-and-swap loop. Mutual exclusion prevents concurrent releases from
  # corrupting the index. The activeDeadlineSeconds ensures a stuck holder
  # cannot block every future release indefinitely -- there is no acquisition
  # timeout in Argo's mutex implementation, so this deadline is the only bound.
  #
  # This is the only action that touches all three paths: it pushes the chart to
  # GAR (gar-sa-key), signs it (cosign-secret), and rewrites the R2 chart index
  # (r2-upload-token).
  - name: release-publish-chart
    synchronization:
      mutexes:
      - name: oberth-chart-index
    activeDeadlineSeconds: 3600
    # A retry re-acquires the mutex rather than inheriting it, which is what
    # makes retrying an index rewrite safe: the compare-and-swap loop starts
    # again from the index as it is now, not as this attempt last saw it.
    retryStrategy:
      limit: 2
      retryPolicy: OnFailure
      backoff:
        duration: "30s"
        factor: 2
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/run/oberth/bin/oberth"]
      args:
      - "secretstore"
      - "exec"
      - "--dir=/run/oberth-secrets"
      - "--path=oberth/data/release/gar-sa-key"
      - "--path=oberth/data/release/r2-upload-token"
      - "--path=oberth/data/release/cosign-secret"
      - "--"
      - "./.oberth/release.sh"
      - "publish-chart"
      env:
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # ---- release-verify burn (secretstore exec, needs gar-sa-key + cosign-secret) ----
  # verify_release calls prepare_signing_identity (cosign-secret) and
  # prepare_registry_auth (gar-sa-key). It reads published objects over public
  # HTTPS, so it needs no R2 upload credential.
  - name: release-verify
    activeDeadlineSeconds: 3600
    retryStrategy:
      limit: 2
      retryPolicy: OnFailure
      backoff:
        duration: "30s"
        factor: 2
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/run/oberth/bin/oberth"]
      args:
      - "secretstore"
      - "exec"
      - "--dir=/run/oberth-secrets"
      - "--path=oberth/data/release/gar-sa-key"
      - "--path=oberth/data/release/cosign-secret"
      - "--"
      - "./.oberth/release.sh"
      - "verify"
      env:
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
        mountPath: /cache/gomod
        subPath: gomod
      - name: work
        mountPath: /cache/gobuild
        subPath: gobuild
      - name: work
        mountPath: /tmp/oberth-trivy
        subPath: trivy-cache
      - name: work
        mountPath: /tmp/oberth-release
        subPath: release
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

  # ---- release-finalize burn (secretstore exec, needs r2-upload-token) ----
  # finalize_release calls initialize_authoritative_r2 and nothing else that
  # reads $OBERTH_SECRETSTORE_DIR: converge_latest_aliases verifies signatures
  # with `cosign verify-blob --key $release_dir/cosign.pub`, the public key
  # release-publish-r2 already left on the shared work volume. No signing
  # happens here, so no signing key is fetched here.
  - name: release-finalize
    activeDeadlineSeconds: 3600
    retryStrategy:
      limit: 2
      retryPolicy: OnFailure
      backoff:
        duration: "30s"
        factor: 2
    container:
      image: "golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3"
      workingDir: /work/src
      command: ["/run/oberth/bin/oberth"]
      args:
      - "secretstore"
      - "exec"
      - "--dir=/run/oberth-secrets"
      - "--path=oberth/data/release/r2-upload-token"
      - "--"
      - "./.oberth/release.sh"
      - "finalize"
      env:
      - name: PATH
        value: "/tmp/oberth-tools/bin:/usr/local/bin:/usr/bin:/bin"
      - name: OBERTH_TOOLS_DIR
        value: "/tmp/oberth-tools"
      - name: HOME
        value: "/tmp"
      - name: GOPATH
        value: "/tmp/oberth-tools/gopath"
      - name: GOTOOLCHAIN
        value: "local"
      - name: GOWORK
        value: "off"
      - name: GOENV
        value: "off"
      - name: GOMODCACHE
        value: "/cache/gomod"
      - name: GOCACHE
        value: "/cache/gobuild"
      - name: GIT_TERMINAL_PROMPT
        value: "0"
      - name: KUBEBUILDER_ASSETS
        value: ""
      - name: TRIVY_CACHE_DIR
        value: "/tmp/oberth-trivy"
      - name: GOLANGCI_LINT_CACHE
        value: "/tmp/oberth-tools/cache/golangci-lint"
      volumeMounts:
      - name: work
        mountPath: /tmp/oberth-tools
        subPath: tools
      - name: work
