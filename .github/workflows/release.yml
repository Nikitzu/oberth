# Tag-triggered release for the fork.
#
# The point is to remove `git clone`, `go build` and `docker build` from a
# teammate's path. After this runs, getting a working deployment is: download
# the binary from the release, `docker pull` the image, `kind load` it, and
# `oberth install --image <digest>`.
#
# The image is pulled on the HOST and loaded into the kind node, not pulled by
# the kubelet. The installer's --image flag aliases a locally held image to the
# digest ref the chart pins, so the node never resolves the name and no
# imagePullSecret has to be threaded through the chart. That holds whether the
# package is public or private, which is why it is worth doing even now that
# the package is public.
#
# Publishing with GITHUB_TOKEN links the package to this repository, and a
# package linked to a public repository is created public. GitHub's docs say
# visibility is not inherited; the observed behaviour is that it is. Do not
# assume the default here without checking the result.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects an uppercase repository name, and github.repository
      # preserves the owner's capitalisation.
      - name: lowercase the image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/arm64 is what a kind node on Apple silicon runs. amd64 is built
      # too so the same tag works on an Intel machine or a Linux homeserver.
      #
      # provenance:false keeps this a plain manifest list rather than attaching
      # an attestation. The chart pins image.ref by digest and the kubelet
      # resolves an index fine either way, but the attestation makes the digest
      # harder to reason about when reading it back by hand.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}

      # The installer and CLI binary, for every machine anyone here runs.
      # CGO_ENABLED=0 so none of them needs anything from its host.
      #
      # Four, not one: Apple silicon and Intel Macs, and Linux on both
      # architectures for the homeserver and for anyone not on a Mac. The
      # server image is already built for both Linux architectures, so a
      # binary that only ran on one kind of laptop was the odd one out.
      - name: build the binaries
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="oberth-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -buildvcs=false \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "$out" ./cmd/oberth
            sha256sum "$out" > "$out.sha256"
          done
          ls -1 oberth-*

      # The installer resolves the chart by its own version from the published
      # oberth-charts index, which only ever carries upstream's releases. A
      # fork's tag is not in there, so without this the install dies at
      # "chart oberth matching <tag> not found" after having already built the
      # cluster. Packaging the chart into the release gives --chart something
      # to point at that does not require a clone.
      - name: package the chart
        run: |
          helm package charts/oberth \
            --version "${GITHUB_REF_NAME#v}" \
            --app-version "${GITHUB_REF_NAME}" \
            --destination .
          ls -1 oberth-*.tgz

      # The digest goes in the release body because it is the one value the
      # install command cannot be written without, and reading it back off the
      # registry by hand is the step people get wrong.
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          Image: \`${{ env.IMAGE }}:${GITHUB_REF_NAME}\`

          Pinned reference for \`--image\`:

              ${{ env.IMAGE }}@${DIGEST}

          Install (macOS builds a kind cluster; Linux uses k3s):

              # Pick the one for this machine:
              #   oberth-darwin-arm64   Apple silicon Mac
              #   oberth-darwin-amd64   Intel Mac
              #   oberth-linux-amd64    Linux x86_64
              #   oberth-linux-arm64    Linux aarch64
              chmod +x oberth-<os>-<arch>
              ./oberth-<os>-<arch> install \\
                --chart oberth-${GITHUB_REF_NAME#v}.tgz \\
                --image ${{ env.IMAGE }}@${DIGEST}

          That is the whole path. The installer prepares the cluster, installs
          Argo and OpenBao, deploys the chart and runs onboarding. On macOS it
          creates a kind cluster; on Linux it expects a k3s cluster it can
          reach. Only the macOS path is exercised on every release.

          The package is public, so nothing needs a login. If the image is
          already in the local Docker daemon the installer loads it into the
          node and the kubelet never reaches out; otherwise the kubelet pulls
          it anonymously. Pulling first is therefore optional, and only worth
          it to front-load the download:

              docker pull ${{ env.IMAGE }}@${DIGEST}

          Verify the binary before running it, with shasum on macOS or
          sha256sum on Linux:

              shasum -a 256 -c oberth-<os>-<arch>.sha256
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            oberth-darwin-* oberth-linux-* oberth-*.tgz
