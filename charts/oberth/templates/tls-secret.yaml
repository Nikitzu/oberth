{{- if not .Values.tls.existingSecret }}
{{- $name := include "oberth.tlsSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{/*
  Security fix: when the Secret already exists, render nothing.
  helm.sh/resource-policy: keep causes Helm to orphan (preserve) the live
  Secret, so no private key bytes ever enter a rendered manifest or the
  Helm release Secret in etcd. This matches the upstream-secrets.yaml pattern.

  Fresh install and offline template/dry-run (lookup returns empty): render
  the Secret with generated key material as before.
*/}}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "oberth.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- $ca := genCA "oberth-local-ca" 3650 }}
  {{- $dns := list "oberth" (printf "oberth.%s" .Release.Namespace) (printf "oberth.%s.svc" .Release.Namespace) (printf "oberth.%s.svc.cluster.local" .Release.Namespace) }}
  {{- $dns = concat $dns (.Values.tls.extraDNSNames | default list) }}
  {{- $cert := genSignedCert "oberth" (.Values.tls.extraIPs | default list) $dns 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  # The signer, kept.
  #
  # Without it the Secret holds a leaf issued by a CA that exists nowhere: a
  # client is handed a certificate it cannot build a chain for, and every TLS
  # client fails with "unable to verify the first certificate" no matter what
  # it is told to trust. ca.crt is the conventional key for exactly this, and
  # is what a client should be pointed at rather than tls.crt.
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
