name: build
on:
  push:
    branches: ['**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: biomejs/setup-biome@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run test
