apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: ubuntu-noble-base
  namespace: kubevirt
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 6Gi
    storageClassName: local-path
