# NOTE: These standalone DataVolumes are NOT applied by the quickstart-test workflow.
# DataVolumes are managed by KubeVirt via spec.dataVolumeTemplates in vms.yaml.
# This file is kept for reference only.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: qs-secretstore-disk
  namespace: quickstart-test
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 5Gi
    storageClassName: local-path
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: qs-beacon-disk
  namespace: quickstart-test
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 4Gi
    storageClassName: local-path
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: qs-target-disk
  namespace: quickstart-test
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 12Gi
    storageClassName: local-path
