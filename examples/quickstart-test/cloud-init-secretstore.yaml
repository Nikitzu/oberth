apiVersion: v1
kind: Secret
metadata:
  name: cloud-init-secretstore
  namespace: quickstart-test
type: Opaque
stringData:
  userdata: |
    #cloud-config
    hostname: qs-secretstore
    users:
      - name: dev
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC9SUkgI2oA5piOqM6ukdTo+pt84kY0qOhTD70nwW71V yellowmegaman@tuxbox
    runcmd:
      - |
        set -e
        # Download OpenBao v2.5.4 binary from tar.gz (asset naming: Linux_x86_64, not linux_amd64)
        curl -fsSL --max-time 300 -L -o /tmp/bao.tar.gz \
          https://github.com/openbao/openbao/releases/download/v2.5.4/bao_2.5.4_Linux_x86_64.tar.gz
        # sha256 pin from the release's official checksums-linux.txt — the
        # fixture exercises the product's secret store, so the store binary
        # itself is integrity-pinned (oberth#151).
        echo "7690853adccaf9bc413768e6bfed4d0ac5222b67f808ba71af0930189f22f94f  /tmp/bao.tar.gz" | sha256sum -c -
        tar -xzf /tmp/bao.tar.gz -C /usr/local/bin bao
        chmod +x /usr/local/bin/bao
        rm -f /tmp/bao.tar.gz
        # Download cloudtaser-port.
        curl -fsSL --max-time 300 -o /usr/local/bin/cloudtaser-port \
          https://releases.cloudtaser.io/port/v0.4.37/cloudtaser-port-linux-amd64
        chmod +x /usr/local/bin/cloudtaser-port
        cat > /etc/systemd/system/openbao-dev.service <<'SVCEOF'
        [Unit]
        Description=OpenBao Dev Server
        After=network-online.target
        Wants=network-online.target

        [Service]
        ExecStart=/usr/local/bin/bao server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
        Restart=on-failure
        RestartSec=5

        [Install]
        WantedBy=multi-user.target
        SVCEOF
        systemctl daemon-reload
        systemctl enable --now openbao-dev.service
        # Wait for vault HTTP health endpoint before signalling readiness (fail loudly if not up)
        VAULT_READY=0
        for i in $(seq 1 30); do
          curl -sf http://127.0.0.1:8200/v1/sys/health 2>/dev/null && VAULT_READY=1 && break
          sleep 1
        done
        test $VAULT_READY -eq 1 || { journalctl -u openbao-dev.service --no-pager -n 20; exit 1; }
        touch /tmp/setup-done
